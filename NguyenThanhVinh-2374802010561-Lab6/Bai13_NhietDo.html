<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 13 - Chuyển đổi nhiệt độ</title>
</head>
<body>
    <h2>Bài 13. Chuyển đổi nhiệt độ</h2>

    <label for="doC">Nhập nhiệt độ (°C):</label>
    <input type="number" id="doC" step="any">
    <br><br>
    <button type="button" onclick="chuyenDoi()">Chuyển đổi</button>

    <p id="ketqua" aria-live="polite"></p>

    <script>
        function chuyenDoi() {
            let duLieu = document.getElementById("doC").value;
            let c = Number(duLieu);
            let ketQua = document.getElementById("ketqua");
            if (duLieu === "" || !Number.isFinite(c)) {
                ketQua.textContent = "Vui lòng nhập nhiệt độ hợp lệ!";
                return;
            }

            let f = (9 / 5) * c + 32;
            if (!Number.isFinite(f)) {
                ketQua.textContent = "Kết quả vượt quá giới hạn tính toán!";
                return;
            }
            ketQua.textContent = c + " °C = " + f + " °F";
        }
    </script>
</body>
</html>
