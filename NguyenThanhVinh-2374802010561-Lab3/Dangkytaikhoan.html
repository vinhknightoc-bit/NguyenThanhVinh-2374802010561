<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 35px 16px; background: white; color: black; font-family: Arial, sans-serif; font-size: 16px; }
        .page { margin: 0 auto; max-width: 100%; }
        h1 { margin: 0 0 24px; text-align: center; font-size: 24px; }
        table { width: 100%; border-spacing: 0 10px; }
        td { vertical-align: top; }
        input, select, textarea, button { font: inherit; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea { max-width: 100%; }
        textarea { resize: vertical; }
        input[type="checkbox"], input[type="radio"] { accent-color: #507fb7; }
        .choice { display: block; margin: 5px 0; }
        .actions { margin-top: 15px; }
        .actions button { margin-right: 8px; cursor: pointer; }
        .required { margin-left: 5px; white-space: nowrap; }
        .back { display: inline-block; margin-top: 28px; color: #24578e; font-size: 14px; }
        .message { margin: 15px 0 0; line-height: 1.5; font-size: 14px; }
        a:focus-visible, button:focus-visible { outline: 2px solid #24578e; outline-offset: 3px; }

        .blue-input { border: 2px solid #385d8a; border-radius: 0; padding: 5px 8px; background: white; }
        .blue-button { padding: 9px 22px; min-width: 105px; border: 2px solid #385d8a; border-radius: 0; color: white; background: #507fb7; }
        .blue-button:hover { background: #385d8a; }

        .page { width: 380px; }
        h1 { font-weight: normal; font-size: 22px; }
        .full { display: block; width: 100%; margin: 8px 0 14px; padding: 10px; }
        .full::placeholder { color: #638ec4; opacity: 1; }
        .two-columns { display: flex; gap: 12px; }
        .two-columns > div { width: 50%; min-width: 0; }
        .section-label { display: block; margin: 16px 0 8px; }
        .actions { text-align: center; }
        textarea { min-height: 140px; }

    </style>
</head>
<body>
    <main class="page">
        <h1>ĐĂNG KÝ TÀI KHOẢN</h1>
        <form method="post">
            <input class="blue-input full" type="text" name="username" placeholder="Nhập username" aria-label="Username" autocomplete="username" required>
            <input class="blue-input full" type="password" name="password" placeholder="Nhập mật khẩu" aria-label="Mật khẩu" autocomplete="new-password" required>
            <input class="blue-input full" type="email" name="email" placeholder="Nhập địa chỉ email" aria-label="Địa chỉ email" autocomplete="email" required>

            <div class="two-columns">
                <div>
                    <label for="birthday">Ngày sinh</label>
                    <input class="blue-input full" type="date" id="birthday" name="birthday" autocomplete="bday">
                </div>
                <div>
                    <label for="gender">Giới tính</label>
                    <select class="blue-input full" id="gender" name="gender">
                        <option value="nam">Nam</option>
                        <option value="nu">Nữ</option>
                    </select>
                </div>
            </div>

            <p class="section-label">Sở thích</p>
            <label class="choice"><input type="checkbox" name="hobbies" value="xem-phim"> Xem phim</label>
            <label class="choice"><input type="checkbox" name="hobbies" value="nghe-nhac"> Nghe nhạc</label>
            <label class="choice"><input type="checkbox" name="hobbies" value="doc-sach"> Đọc sách</label>
            <label class="choice"><input type="checkbox" name="hobbies" value="du-lich"> Du lịch</label>

            <label class="section-label" for="intro">Giới thiệu bản thân</label>
            <textarea class="blue-input full" id="intro" name="intro" rows="5"></textarea>

            <div class="actions">
                <button class="blue-button" type="reset">Cancel</button>
                <button class="blue-button" type="submit">Đăng ký</button>
            </div>
        </form>
        <p id="message" class="message" role="status"></p>
        <a class="back" href="Index.html">← Về trang bài tập</a>
    </main>

    <script>
        // Mô phỏng gửi biểu mẫu; không lưu thông tin hoặc mật khẩu.
        const form = document.querySelector("form");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            message.textContent = "Thông tin hợp lệ. Đây là biểu mẫu thực hành, dữ liệu chưa được gửi đến máy chủ.";
        });

        form.addEventListener("reset", function () {
            message.textContent = "";
        });
    </script>
</body>
</html>
