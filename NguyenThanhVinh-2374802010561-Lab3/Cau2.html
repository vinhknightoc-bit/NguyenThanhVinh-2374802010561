<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>
    <form action="#" method="get">
        <table cellpadding="5" cellspacing="0">
            <tr>
                <td colspan="2" align="center">
                    <h2>Registration Form</h2>
                </td>
            </tr>

            <tr>
                <td><label for="firstname">First Name:</label></td>
                <td>
                    <input type="text" id="firstname" name="firstname"
                           placeholder="Enter First Name" size="30">
                </td>
            </tr>

            <tr>
                <td><label for="lastname">Last Name:</label></td>
                <td>
                    <input type="text" id="lastname" name="lastname"
                           placeholder="Enter Last Name" size="30">
                </td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td>
                    <input type="email" id="email" name="email"
                           placeholder="Enter Email Address" size="30">
                </td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td>
                    <input type="password" id="password"
                           size="30">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <label>
                        <input type="radio" name="gender"
                               value="Male"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Female"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Other"> Other
                    </label>
                </td>
            </tr>

            <tr>
                <td><label for="age">Age:</label></td>
                <td>
                    <input type="number" id="age" name="age" min="0">
                </td>
            </tr>

            <tr>
                <td valign="top">Preferences:</td>
                <td>
                    <label>
                        <input type="checkbox" name="preferences"
                               value="Acrylic Painting"> Acrylic Painting
                    </label><br>

                    <label>
                        <input type="checkbox" name="preferences"
                               value="Oil Painting"> Oil Painting
                    </label><br>

                    <label>
                        <input type="checkbox" name="preferences"
                               value="Water Color Painting"> Water Color Painting
                    </label>
                </td>
            </tr>

            <tr>
                <td><label for="occupation">Occupation:</label></td>
                <td>
                    <select id="occupation" name="occupation">
                        <option value="Student">Student</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Engineer">Engineer</option>
                        <option value="Other">Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td valign="top"><label for="bio">Bio:</label></td>
                <td>
                    <textarea id="bio" name="bio" cols="30" rows="4"
                              placeholder="Share a few lines about yourself..."></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="reset" value="RESET">
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
