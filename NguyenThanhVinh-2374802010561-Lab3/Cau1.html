<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested.html</title>
</head>
<body>
    <table border="1" cellpadding="5" cellspacing="3">
        <tr bgcolor="#33CCCC">
            <th>Device</th>
            <th>Brand</th>
            <th>Specifications</th>
        </tr>

        <tr>
            <td>Smartphone</td>
            <td>Apple</td>

            <td>
                <table border="1" cellpadding="5" cellspacing="3">
                    <tr bgcolor="#FFDF60">
                        <th>Model</th>
                        <th>Storage</th>
                    </tr>

                    <tr>
                        <td>iPhone 12 Pro</td>
                        <td>256GB</td>
                    </tr>

                    <tr>
                        <td>iPhone SE</td>
                        <td>128GB</td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td>15.6&quot; Display</td>
        </tr>

        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td>10.5&quot; Display</td>
        </tr>
    </table>
</body>
</html>
