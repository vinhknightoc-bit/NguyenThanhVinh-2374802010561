<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký mua hoa</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 35px 16px; background: white; color: black; font-family: Arial, sans-serif; font-size: 16px; }
        .page { margin: 0 auto; max-width: 100%; }
        h1 { margin: 0 0 24px; text-align: center; font-size: 24px; }
        table { width: 100%; border-spacing: 0 10px; }
        td { vertical-align: top; }
        input, select, textarea, button { font: inherit; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea { max-width: 100%; }
        textarea { resize: vertical; }
        input[type="checkbox"], input[type="radio"] { accent-color: #507fb7; }
        .choice { display: block; margin: 5px 0; }
        .actions { margin-top: 15px; }
        .actions button { margin-right: 8px; cursor: pointer; }
        .required { margin-left: 5px; white-space: nowrap; }
        .back { display: inline-block; margin-top: 28px; color: #24578e; font-size: 14px; }
        .message { margin: 15px 0 0; line-height: 1.5; font-size: 14px; }
        a:focus-visible, button:focus-visible { outline: 2px solid #24578e; outline-offset: 3px; }

        .page { width: 610px; }
        h1 { font-size: 28px; }
        table { border-spacing: 0 5px; }
        td:first-child { width: 135px; text-align: right; padding: 4px 8px 0 0; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea { border: 1px solid #a2b5c3; border-radius: 0; padding: 3px 5px; background: white; }
        .medium { width: 300px; }
        .wide { width: 95%; }
        .short { width: 75px; }
        .choice { margin: 1px 0; }
        .line { display: flex; align-items: center; gap: 0; }
        .line input { min-width: 0; }
        .file { width: 100%; font-size: 14px; }
        textarea { display: block; width: 95%; min-height: 85px; }
        button { padding: 3px 12px; border: 1px solid #90a6b7; border-radius: 3px; background: #f2f2f2; font-size: 14px; cursor: pointer; }
        button:hover { background: #e1ebf2; }
        @media (max-width: 500px) { td:first-child { width: 104px; } .medium { width: calc(100% - 30px); } h1 { font-size: 24px; } }

        .page { width: 660px; }
        h1 { font-size: 24px; }
        .notice { margin: 0 0 12px; color: red; line-height: 1.4; }
        .phone { width: 170px; }
        td:first-child { width: 115px; }
        .line .wide { width: calc(100% - 35px); }
        @media (max-width: 500px) { .phone { width: calc(100% - 35px); } }

    </style>
</head>
<body>
    <main class="page">
        <h1>ĐĂNG KÝ MUA HOA</h1>
        <p class="notice">Quý độc giả hãy điền đầy đủ các thông tin theo yêu cầu để nhận được sản phẩm hoa, cây cảnh ưa thích nhất</p>
        <form method="post">
            <table>
                <tr>
                    <td><label for="fullname">Họ và tên:</label></td>
                    <td><div class="line"><input class="medium" type="text" id="fullname" name="fullname" autocomplete="name" required><span class="required">(*)</span></div></td>
                </tr>
                <tr>
                    <td><label for="address">Địa chỉ:</label></td>
                    <td><div class="line"><input class="wide" type="text" id="address" name="address" autocomplete="street-address" required><span class="required">(*)</span></div></td>
                </tr>
                <tr>
                    <td><label for="phone">Điện thoại:</label></td>
                    <td><input class="phone" type="tel" id="phone" name="phone" autocomplete="tel" required><span class="required">(*)</span></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><div class="line"><input class="medium" type="email" id="email" name="email" autocomplete="email" required><span class="required">(*)</span></div></td>
                </tr>
                <tr>
                    <td><label for="flower">Loại hoa:</label></td>
                    <td>
                        <select id="flower" name="flower">
                            <option value="hoa-hong">Hoa Hồng</option>
                            <option value="hoa-cuc">Hoa Cúc</option>
                            <option value="hoa-lan">Hoa Lan</option>
                            <option value="hoa-ly">Hoa Ly</option>
                        </select>
                        <label for="color">Màu</label>
                        <select id="color" name="color">
                            <option value="do">Đỏ</option>
                            <option value="vang">Vàng</option>
                            <option value="trang">Trắng</option>
                            <option value="hong">Hồng</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="quantity">Số lượng:</label></td>
                    <td><input class="short" type="number" id="quantity" name="quantity" min="1" step="1" required><span class="required">(*)</span></td>
                </tr>
                <tr>
                    <td id="unit-label">Đơn vị tính:</td>
                    <td role="group" aria-labelledby="unit-label">
                        <label><input type="radio" name="unit" value="nhanh"> Nhánh</label>
                        <label><input type="radio" name="unit" value="bo"> Bó</label>
                        <label><input type="radio" name="unit" value="chau"> Chậu</label>
                    </td>
                </tr>
                <tr>
                    <td id="payment-label">Thanh toán:</td>
                    <td role="group" aria-labelledby="payment-label">
                        <label><input type="radio" name="payment" value="tien-mat"> Tiền mặt</label>
                        <label><input type="radio" name="payment" value="chuyen-khoan"> Chuyển khoản</label>
                        <label><input type="radio" name="payment" value="master-card"> Master card</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="request">Yêu cầu:</label></td>
                    <td><textarea id="request" name="request" rows="4"></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit">Đăng ký</button> <button type="reset">Nhập lại</button></td>
                </tr>
            </table>
        </form>
        <p id="message" class="message" role="status"></p>
        <a class="back" href="Index.html">← Về trang bài tập</a>
    </main>

    <script>
        // Mô phỏng gửi biểu mẫu; không lưu thông tin hoặc mật khẩu.
        const form = document.querySelector("form");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            message.textContent = "Thông tin hợp lệ. Đây là biểu mẫu thực hành, dữ liệu chưa được gửi đến máy chủ.";
        });

        form.addEventListener("reset", function () {
            message.textContent = "";
        });
    </script>
</body>
</html>
