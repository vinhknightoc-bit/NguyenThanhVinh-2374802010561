<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch học</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 600px;
            max-width: 100%;
            margin: auto;
            border-collapse: collapse;
            font-size: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>LỊCH HỌC</h1>

    <table>
        <tr>
            <th>Thứ</th>
            <th>Hai</th>
            <th>Ba</th>
            <th>Tư</th>
            <th>Năm</th>
            <th>Sáu</th>
        </tr>

        <tr>
            <td rowspan="2">Sáng</td>
            <td>LTHĐT</td>
            <td rowspan="2">CTDL-GT</td>
            <td rowspan="2">PTHT</td>
            <td>CSDL</td>
            <td rowspan="2">CSDL</td>
        </tr>

        <tr>
            <td>LTW</td>
            <td>LTW</td>
        </tr>

        <tr>
            <td rowspan="2">Chiều</td>
            <td>TDTT</td>
            <td>QTM</td>
            <td>TRR</td>
            <td colspan="2">TDTT</td>
        </tr>

        <tr>
            <td colspan="2">AV</td>
            <td>CSDL</td>
            <td colspan="2">CNTT CB</td>
        </tr>
    </table>
</body>
</html>
